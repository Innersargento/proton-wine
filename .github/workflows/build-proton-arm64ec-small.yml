name: Build Proton Wine arm64ec (small)

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Android SDK level (28 = Android 9+, 35 = Android 15 / 16 KB pages)'
        required: true
        default: '28'
        type: choice
        options:
          - '28'
          - '35'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386 \
            zstd

      - name: Download and extract termuxfs for aarch64
        run: |
          mkdir -p $HOME/termuxfs/aarch64
          cd $HOME/termuxfs/aarch64
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar
          ls -la $HOME/termuxfs/aarch64/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Run autogen.sh
        run: bash autogen.sh --aarch64

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: bash build-scripts/build-step0.sh

      - name: Build sysvshm library
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure build
        env:
          CROSSCFLAGS: -g0 -O2
        run: |
          if [ "${{ inputs.sdk }}" == "35" ]; then
            bash build-scripts/build-step-arm64ec.sh --configure --enable-16kb-pages
          else
            bash build-scripts/build-step-arm64ec.sh --configure
          fi

      - name: Build Proton
        env:
          CROSSCFLAGS: -g0 -O2
        run: |
          if [ "${{ inputs.sdk }}" == "35" ]; then
            bash build-scripts/build-step-arm64ec.sh --build --enable-16kb-pages
          else
            bash build-scripts/build-step-arm64ec.sh --build
          fi

      - name: Install Proton
        env:
          CROSSCFLAGS: -g0 -O2
        run: |
          if [ "${{ inputs.sdk }}" == "35" ]; then
            bash build-scripts/build-step-arm64ec.sh --install --enable-16kb-pages
          else
            bash build-scripts/build-step-arm64ec.sh --install
          fi

      - name: Strip binaries
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          STRIP="$HOME/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          before_mb=$(du -sm "$OUTPUT_DIR" | cut -f1)
          find "$OUTPUT_DIR/lib" "$OUTPUT_DIR/bin" -type f \
            \( -name '*.dll' -o -name '*.exe' -o -name '*.drv' -o -name '*.so' -o -name 'wine' -o -name 'wine-preloader' \) \
            -print0 | while IFS= read -r -d '' f; do
              "$STRIP" --strip-all "$f" 2>/dev/null || "$STRIP" --strip-debug "$f" 2>/dev/null || true
            done
          after_mb=$(du -sm "$OUTPUT_DIR" | cut -f1)
          echo "OUTPUT tree: ${before_mb}MB -> ${after_mb}MB after strip."

      - name: Download prefixPack.txz
        run: |
          wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec.txz -O $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json
        run: |
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "10.0-4-arm64ec",
            "versionCode": 2,
            "description": "Proton 10.0-4 arm64ec (stripped, zstd) - Windows compatibility layer with improved gaming support",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

      - name: Package build artifacts
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          cd $OUTPUT_DIR

          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf proton-10.0-4-arm64ec.wcp bin lib share prefixPack.txz profile.json
          mv proton-10.0-4-arm64ec.wcp $GITHUB_WORKSPACE/
          ls -lah $GITHUB_WORKSPACE/proton-10.0-4-arm64ec.wcp

      - name: Upload Proton build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-arm64ec-small-sdk${{ inputs.sdk }}
          path: proton-10.0-4-arm64ec.wcp
          retention-days: 30
