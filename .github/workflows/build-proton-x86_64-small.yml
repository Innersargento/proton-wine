name: Build Proton Wine x86_64 (small)

# Based on build-proton-arm64ec-small.yml, but with the strip step reworked to
# follow the Pipetto-crypto/wine (Winlator) build model:
#
#   Wine's own `make install` stamps every builtin PE module with the 32-byte
#   "Wine builtin DLL" signature via `winebuild --builtin` (tools/makedep.c).
#   Post-processing those PE files with llvm-strip is what breaks the resulting
#   Wine under box64 (wfm.exe dies deterministically ~330ms after start, with no
#   SEH exception and no box64 signal report).
#
#   Therefore: PE modules (.dll/.exe/.drv/...) are NEVER touched after install.
#   Only host ELF objects (lib/wine/x86_64-unix/*.so, bin/wine, bin/wine-preloader)
#   are stripped, and files are classified by magic bytes rather than by
#   extension so a PE can never be hit by accident.

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Android SDK level (28 = Android 9+, 35 = Android 15 / 16 KB pages)'
        required: true
        default: '28'
        type: choice
        options:
          - '28'
          - '35'

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      OUTPUT_DIR: /home/runner/compiled-files-x86_64
      NDK_BIN: /home/runner/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin
      VERSION_NAME: 10.0-4
      CROSSCFLAGS: -g0 -O2

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386 \
            zstd

      - name: Download and extract termuxfs for x86_64
        run: |
          mkdir -p $HOME/termuxfs/x86_64
          cd $HOME/termuxfs/x86_64
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-x86_64.tar
          tar -xf termuxfs-x86_64.tar
          ls -la $HOME/termuxfs/x86_64/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Run autogen.sh
        run: bash autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: bash build-scripts/build-step0.sh

      - name: Build sysvshm library
        run: bash build-scripts/build-step-x86_64.sh --build-sysvshm

      - name: Build ntsync-android library
        env:
          NTSYNC_ANDROID_DIR: ${{ github.workspace }}/ntsync-android
        run: bash build-scripts/build-step-x86_64.sh --build-ntsync-android

      - name: Configure build
        run: |
          if [ "${{ inputs.sdk }}" == "35" ]; then
            bash build-scripts/build-step-x86_64.sh --configure --enable-16kb-pages
          else
            bash build-scripts/build-step-x86_64.sh --configure
          fi

      - name: Build Proton
        run: |
          if [ "${{ inputs.sdk }}" == "35" ]; then
            bash build-scripts/build-step-x86_64.sh --build --enable-16kb-pages
          else
            bash build-scripts/build-step-x86_64.sh --build
          fi

      - name: Install Proton
        run: |
          if [ "${{ inputs.sdk }}" == "35" ]; then
            bash build-scripts/build-step-x86_64.sh --install --enable-16kb-pages
          else
            bash build-scripts/build-step-x86_64.sh --install
          fi

      # Strip ELF host objects only. PE modules keep the exact bytes that
      # `make install` + `winebuild --builtin` produced.
      - name: Strip host ELF objects (PE modules untouched)
        run: |
          set -euo pipefail
          STRIP="$NDK_BIN/llvm-strip"

          before_kb=$(du -sk "$OUTPUT_DIR" | cut -f1)
          elf=0
          pe=0
          other=0
          failed=0

          while IFS= read -r -d '' f; do
            magic=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            case "$magic" in
              7f454c46*)
                # ELF: --strip-unneeded keeps .dynsym/.dynstr, drops only what
                # neither the dynamic linker nor box64 needs to resolve symbols.
                if "$STRIP" --strip-unneeded "$f"; then
                  elf=$((elf + 1))
                else
                  echo "::warning::llvm-strip failed on ${f#$OUTPUT_DIR/}"
                  failed=$((failed + 1))
                fi
                ;;
              4d5a*)
                pe=$((pe + 1))
                ;;
              *)
                other=$((other + 1))
                ;;
            esac
          done < <(find "$OUTPUT_DIR/lib" "$OUTPUT_DIR/bin" -type f -print0)

          after_kb=$(du -sk "$OUTPUT_DIR" | cut -f1)
          echo "ELF stripped : $elf"
          echo "PE untouched : $pe"
          echo "other files  : $other"
          echo "strip errors : $failed"
          echo "tree: $((before_kb / 1024))MB -> $((after_kb / 1024))MB"

          [ "$failed" -eq 0 ] || { echo "::error::llvm-strip reported failures"; exit 1; }
          [ "$elf" -gt 0 ] || { echo "::error::no ELF object was stripped, layout changed?"; exit 1; }

      # Guard rail: every builtin PE must still carry the 32-byte
      # "Wine builtin DLL" signature at file offset 64 that winebuild wrote.
      # If it is missing, ntdll loads the module as native instead of builtin
      # (dlls/ntdll/loader.c, build_module) and the build is silently broken.
      - name: Verify Wine builtin PE signatures
        run: |
          set -euo pipefail
          ok=0
          bad=0

          # compare raw bytes instead of shell strings, so embedded NULs are safe
          sig=$(mktemp)
          printf 'Wine builtin DLL' > "$sig"

          for archdir in "$OUTPUT_DIR"/lib/wine/*-windows; do
            [ -d "$archdir" ] || continue
            while IFS= read -r -d '' f; do
              [ "$(head -c 2 "$f")" = "MZ" ] || continue
              if head -c 80 "$f" | tail -c 16 | cmp -s - "$sig"; then
                ok=$((ok + 1))
              else
                bad=$((bad + 1))
                echo "::error::missing 'Wine builtin DLL' signature: ${f#$OUTPUT_DIR/}"
              fi
            done < <(find "$archdir" -type f -print0)
          done

          echo "builtin PE modules signed : $ok"
          echo "builtin PE modules broken : $bad"
          [ "$ok" -gt 0 ] || { echo "::error::no builtin PE module found"; exit 1; }
          [ "$bad" -eq 0 ] || exit 1

      - name: Download prefixPack.txz
        run: |
          wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-x86_64.txz -O $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json
        run: |
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "${VERSION_NAME}-x86_64",
            "versionCode": 2,
            "description": "Proton ${VERSION_NAME} x86_64 (ELF-stripped, zstd) - Windows compatibility layer with improved gaming support",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

      - name: Package build artifacts
        run: |
          set -euo pipefail
          cd "$OUTPUT_DIR"

          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf "proton-${VERSION_NAME}-x86_64.wcp" bin lib share prefixPack.txz profile.json
          mv "proton-${VERSION_NAME}-x86_64.wcp" $GITHUB_WORKSPACE/
          ls -lah "$GITHUB_WORKSPACE/proton-${VERSION_NAME}-x86_64.wcp"

      - name: Upload Proton build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-x86_64-small-sdk${{ inputs.sdk }}
          path: proton-10.0-4-x86_64.wcp
          retention-days: 30
